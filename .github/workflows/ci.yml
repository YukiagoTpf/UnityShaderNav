name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: unity-shader-nav

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20+ exposes the global `File` that @vscode/vsce -> undici needs;
          # on Node 18 the package-layout VSCE test crashes with
          # "ReferenceError: File is not defined". engines.node still allows >=18
          # for the shipped server (it runs on VS Code's bundled runtime).
          node-version: 20
          cache: npm
          cache-dependency-path: unity-shader-nav/package-lock.json

      - name: Read pinned VS Code test version
        id: vscode-test-version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < tests/vscode-version.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tests/vscode-version.txt: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache VS Code test runtime
        uses: actions/cache@v4
        with:
          # Runtime identity includes platform, the exact tested VS Code
          # release, and the test-electron implementation lockfile.
          path: unity-shader-nav/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode-test-version.outputs.version }}-${{ hashFiles('unity-shader-nav/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run fast verification
        run: npm run check:fast

      - name: Run package verification
        run: npm run test:package

      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libnss3 \
            libgbm1 \
            libasound2t64 \
            libgtk-3-0 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxshmfence1
        working-directory: .

      - name: Run Electron verification
        # test:package above produced the exact runtime and compiled tests.
        run: xvfb-run -a npm run test:electron:prepared
